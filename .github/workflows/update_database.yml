name: Weekly NFL Database Update

on:
  schedule:
    # Runs every Tuesday at 09:00 UTC (4:00 AM EST / after MNF)
    - cron: '0 9 * * 2'
  workflow_dispatch: 
jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas pyarrow polars

      - name: Run database builder script
        run: python build_database.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl_data.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated weekly database refresh [skip ci]" && git push)